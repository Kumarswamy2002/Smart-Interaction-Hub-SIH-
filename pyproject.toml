[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-interaction-hub"
version = "1.0.0"
description = "Smart Interaction Hub (SIH) - Production-grade Interaction & Automation Platform"
readme = "README.md"
authors = [
    { name = "Project Owner", email = "owner@sih.local" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5"
]

[project.scripts]
sih = "sih.cli.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
